name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned so CI and the README's version matrix agree.
  RECIPE_REPO: https://raw.githubusercontent.com/deepseek-ai/deepseek-recipe
  RECIPE_SHA: 935817c66f5d6e64838f419692545f06787e485f
  TOKENIZER: ${{ github.workspace }}/.ci-tokenizer/v41/tokenizer.json

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # deepseek-recipe ships abi3 manylinux wheels, so no Rust/OpenCV is needed here.
          pip install -e ".[test]"

      - name: Fetch the V4.1 tokenizer
        run: |
          mkdir -p "$(dirname "$TOKENIZER")"
          curl -fsSL -o "$TOKENIZER" \
            "$RECIPE_REPO/$RECIPE_SHA/static/tokenizers/v41/tokenizer.json"

      # Without this the suite SKIPS instead of failing, which would look green while
      # testing nothing. Fail loudly here instead.
      - name: Assert the tokenizer is present and non-empty
        run: |
          test -s "$TOKENIZER" || { echo "tokenizer missing: $TOKENIZER"; exit 1; }
          ls -l "$TOKENIZER"

      - name: Tests
        env:
          DEEPSEEK_RECIPE_TOKENIZER: ${{ env.TOKENIZER }}
        run: |
          set -o pipefail
          pytest -q -rs | tee /tmp/pytest.txt
          if grep -qE "[0-9]+ skipped" /tmp/pytest.txt; then
            echo "::error::tests were skipped (missing tokenizer?)"
            exit 1
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml points pyright at ./.venv (venvPath/venv). Create it explicitly
      # rather than relying on the fallback interpreter search, so this job resolves
      # imports the same way the documented local workflow does.
      - name: Create the project venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/pyright

  package:
    name: build and smoke-test the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the wheel metadata
        run: |
          python - <<'PY'
          import glob, pathlib, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          meta_name = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA")][0]
          meta = zipfile.ZipFile(whl).read(meta_name).decode()
          fields = {}
          for line in meta.splitlines():
              if ": " in line and not line.startswith(" "):
                  k, _, v = line.partition(": ")
                  fields.setdefault(k, v)
          print("wheel:", pathlib.Path(whl).name)
          print("Name:", fields.get("Name"), "Version:", fields.get("Version"))
          print("Requires-Python:", fields.get("Requires-Python"))
          assert fields.get("Name") == "deepinfer-bridge"
          assert fields.get("Version") == "0.2.0", fields.get("Version")
          assert fields.get("Requires-Python") == ">=3.10"
          PY

      - name: Install the wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import deepinfer_bridge; print('__version__', deepinfer_bridge.__version__)"
          /tmp/smoke/bin/deepinfer-bridge --help > /dev/null
          echo "console script OK"
